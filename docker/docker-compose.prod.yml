version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: barter-postgres
    restart: unless-stopped
    env_file:
      - ../server/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: barter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  clamav:
    image: clamav/clamav:latest
    container_name: barter-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    # Если сеть не даёт скачивать обновления баз (freshclam сыпет WARNING/ERROR),
    # демона обновлений можно выключить — сканирование работает на базе из образа:
    # environment:
    #   - CLAMAV_NO_FRESHCLAMD=true

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      target: prod
    container_name: barter-server
    restart: unless-stopped
    env_file:
      - ../server/.env
    depends_on:
      - postgres
      - redis
      - clamav
    ports:
      - "3000:3000"
    volumes:
      - media_data:/app/media
    command: node dist/main.js

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
      target: prod
    container_name: barter-client
    restart: unless-stopped
    env_file:
      - ../client/.env
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
  media_data:
