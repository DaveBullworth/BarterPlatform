version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ../server/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  server:
    image: ghcr.io/davebullworth/barter-server:1.1
    restart: unless-stopped
    env_file:
      - ../server/.env
    ports:
      - "3000:3000"
    volumes:
      - media_data:/app/media
    depends_on:
      - postgres
      - redis

  client:
    image: ghcr.io/davebullworth/barter-client:1.1
    restart: unless-stopped
    env_file:
      - ../client/.env
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
  media_data:
